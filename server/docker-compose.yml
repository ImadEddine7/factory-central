services:
  postgres:
    image: postgres:16-alpine
    container_name: factory-central-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory_dev
      POSTGRES_DB: factory_central
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
