name: Deploy Dev

on:
  push:
    branches: [dev]

permissions:
  contents: write

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_ENV: dev
          VITE_BASE_PATH: /factory-central-dev/
      - name: Deploy to dev repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: ImadEddine7/factory-central-dev
          publish_dir: ./dist
          publish_branch: main
