databases:
  - name: factory-central-db
    plan: free
    databaseName: factory_central
    user: factory

services:
  - type: web
    name: factory-central-api
    plan: free
    runtime: node
    buildCommand: cd server && npm ci && npx prisma generate && npm run build
    startCommand: cd server && npx prisma migrate deploy && npx prisma db seed && node dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: factory-central-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://imadeddine7.github.io,http://localhost:5173
      - key: NODE_ENV
        value: production
